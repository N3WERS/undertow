name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Проверить типы
        run: npx tsc --noEmit -p tsconfig.json

      - name: Собрать установщик
        run: npm run dist
        env:
          # сертификата нет, поэтому не ищем его в системе
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Показать, что собралось
        run: dir release

      - name: Приложить установщик и фид к релизу
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Undertow-Setup-*.exe
            release/latest.yml
            release/*.blockmap
          generate_release_notes: true

      # Старые установки 0.7.9 и ниже ищут обновления в undertow-releases.
      # Одно зеркало нужно, чтобы они получили версию с новым app-update.yml
      # и дальше перешли на основной репозиторий. Для новых версий это не нужно.
      - name: Зеркало фида для старых версий
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          repository: N3WERS/undertow-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          files: |
            release/Undertow-Setup-*.exe
            release/latest.yml
            release/*.blockmap
          generate_release_notes: true

      - name: Сохранить установщик как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: undertow-windows
          path: release/Undertow-Setup-*.exe
          if-no-files-found: error

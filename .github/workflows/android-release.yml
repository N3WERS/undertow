name: Android Release

on:
  push:
    tags:
      - 'android-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Собрать APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Подготовить APK к релизу
        run: |
          VERSION="${GITHUB_REF_NAME#android-v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="0.1.0"
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk "Undertow-Android-${VERSION}.apk"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Сохранить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: undertow-android
          path: Undertow-Android-*.apk
          if-no-files-found: error

      - name: Приложить APK к релизу
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Undertow-Android-*.apk
          name: Undertow Android ${{ env.VERSION }}
          body: |
            Android-порт Undertow ${{ env.VERSION }}.

            MVP: главная с чартом, «Течение», поиск, библиотека, плейлисты, очередь,
            полноэкранный плеер, скачивание, фоновая игра и оформление в стиле desktop.
          generate_release_notes: true
